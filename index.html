<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="theme-color" content="#007B83" />
  <meta name="description" content="2026 Tokyo, Kawaguchiko, Gotemba and Nikko interactive travel itinerary." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tokyo 2026" />
  <title>TOKYO 2026｜東京旅遊行程</title>
  <style>
    :root{
      --bg:#756555;
      --panel:#ffffff;
      --card:#ffffff;
      --text:#2B3B3C;
      --muted:#2B3B3C;
      --border:rgba(43,59,60,.24);
      --accent:#A4AB82;
      --accent-soft:rgba(164,171,130,.20);
      --cream:#ffffff;
      --green:#007B83;
      --red:#ED6D3D;
      --shadow:0 10px 30px rgba(48,52,57,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
    }
    button,textarea{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:24px 0 56px}
    .hero{
      background:linear-gradient(135deg,#ffffff,#f4fbfb);
      border:1px solid var(--border);
      border-radius:28px;
      padding:26px;
      box-shadow:var(--shadow);
    }
    .hero-top{display:flex;gap:24px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:clamp(28px,5vw,44px);margin:8px 0 6px;line-height:1.08}
    .subtitle{color:var(--muted);font-size:14px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px}
    .countbox{min-width:160px;border:1px solid var(--border);background:#fff;border-radius:18px;padding:14px}
    .countbox .big{font-size:28px;font-weight:700;margin-top:2px}
    .hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
    .stat{padding:12px 0}
    .label{font-size:12px;color:var(--muted)}
    .value{font-weight:700;margin-top:4px}
    .muted{color:var(--muted)}
    .progress-wrap{margin:20px 2px 0}
    .progress-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
    .progress{height:9px;background:#dedbd4;border-radius:999px;overflow:hidden}
    .progress>div{height:100%;width:0;background:var(--accent);transition:width .2s ease}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin-top:24px}
    .tab{
      flex:0 0 190px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      border-radius:18px;
      padding:12px 14px;
      text-align:left;
      display:flex;
      align-items:baseline;
      gap:8px;
      white-space:nowrap;
    }
    .tab[aria-selected="true"]{background:var(--accent);color:var(--text);border-color:var(--accent)}
    .tab .tab-main{font-size:19px;font-weight:700;line-height:1.2}
    .tab .date{font-size:19px;font-weight:700;margin:0;white-space:nowrap}
    .tab .weekday{font-size:12px;font-weight:500;opacity:.78}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
    .filter{
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-size:14px;
    }
    .filter[aria-pressed="true"]{background:var(--accent);color:var(--text);border-color:var(--accent)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}
    .dayhead{margin:6px 0 16px}
    .dayhead h2{font-size:26px;margin:4px 0}
    .timeline{position:relative}
    .timeline:before{
      content:"";
      position:absolute;
      left:19px;
      top:22px;
      bottom:22px;
      width:1px;
      background:var(--border);
    }
    .event{
      display:grid;
      grid-template-columns:40px minmax(0,1fr);
      gap:12px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
      margin-bottom:10px;
      box-shadow:0 3px 14px rgba(48,52,57,.03);
    }
    .dot{
      width:38px;height:38px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      border:1px solid var(--border);background:#fff;
      position:relative;z-index:1;
    }
    .event-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    .time{font-size:12px;color:var(--muted)}
    .event-title{font-weight:700;margin-top:3px}
    .done .event-title{text-decoration:line-through;opacity:.58}
    .done{opacity:.75}
    .check{font-size:12px;color:var(--muted);white-space:nowrap}
    .detail-btn{
      border:0;background:transparent;padding:0;margin-top:8px;
      color:var(--accent);text-decoration:underline;text-underline-offset:4px
    }
    .details{
      background:#f7f7f5;border-radius:12px;padding:10px 12px;margin-top:8px;
      color:var(--muted);font-size:14px
    }
    aside{display:flex;flex-direction:column;gap:14px}
    .sidecard{
      background:#fff;border:1px solid var(--border);border-radius:18px;padding:15px
    }
    textarea{
      width:100%;min-height:110px;border:1px solid var(--border);
      border-radius:12px;padding:12px;background:#fafafa;color:var(--text);
      resize:vertical;font-size:16px
    }
    .sidehead{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .clear{
      border:1px solid var(--border);background:#fff;border-radius:10px;
      padding:6px 9px;font-size:12px
    }

    .map-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:10px;
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--accent);
      color:var(--text);
      font-size:13px;
      font-weight:700;
      text-decoration:none;
      transition:filter .15s ease,transform .15s ease;
    }
    .event-map-btn{
      margin-top:7px;
      padding:6px 10px;
      font-size:12px;
      width:max-content;
      max-width:100%;
    }
    .map-btn:hover{filter:brightness(.96)}
    .map-btn:active{transform:translateY(1px)}
    .footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}
    button:focus-visible, textarea:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
    @media (max-width:760px){
      .hero-grid{grid-template-columns:1fr}
      .layout{grid-template-columns:1fr}
      aside{order:-1}
    }
    @media (max-width:420px){
      .wrap{width:min(100% - 18px,1100px);padding-top:10px}
      .hero{padding:18px;border-radius:22px}
      .tab{flex-basis:112px}
      .event{grid-template-columns:36px minmax(0,1fr);padding:12px}
      .dot{width:34px;height:34px}
    }
  </style>
</head>

    </section>

    <div class="footer">TOKYO 2026 · Interactive Travel Itinerary</div>
  </main>

            {time:'17:03–17:54',type:'transport',icon:'🚄',title:'N’EX 43號：東京站 → 成田二航',details:'機場交通候選 2。'},
            {time:'17:05–18:16',type:'transport',icon:'🚇',title:'Access 特急：日本橋 → 成田二航',details:'機場交通候選 3。'},
            {time:'約18:10',type:'transport',icon:'🛄',title:'抵達成田機場'},
            {time:'20:40–23:20',type:'transport',icon:'✈️',title:'NRT 第二航廈 → TPE 第一航廈'}
          ]
        }
      ];

      let selectedDay = 0;
      let filter = 'all';
      const checked = new Set();

      const $ = s => document.querySelector(s);
      const $$ = s => [...document.querySelectorAll(s)];

      function esc(s){
        return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      }

      function updateProgress(){
        const total = days.reduce((n,d)=>n+d.events.length,0);
        const done = checked.size;
      }

      function render(){
        const d = days[selectedDay];
        $('#dayKicker').textContent = d.kicker;
        $('#dayTitle').textContent = d.title;
        $('#daySubtitle').textContent = d.subtitle;
        $('#hotelName').textContent = d.hotel;
        const hotelMap = $('#hotelMap');
        if(d.map){
          hotelMap.href = d.map;
          hotelMap.hidden = false;
        } else {
          hotelMap.hidden = true;
        }
        $('#hotelNote').textContent = d.hotelNote;
        $('#dayHighlight').textContent = d.highlight;

        const timeline = $('#timeline');
        timeline.innerHTML = '';

        d.events.forEach((ev,i)=>{
          if(filter !== 'all' && ev.type !== filter) return;
          const key = `${selectedDay}-${i}`;
          const article = document.createElement('article');
          article.className = 'event' + (checked.has(key) ? ' done' : '');
          const detailId = `detail-${selectedDay}-${i}`;
          article.innerHTML = `
            <div class="dot" aria-hidden="true">${ev.icon}</div>
            <div>
              <div class="event-top">
                <div>
                  <div class="time">${esc(ev.time)}</div>
                  <div class="event-title">${esc(ev.title)}</div>
                  ${ev.map ? `<a class="map-btn event-map-btn" href="${esc(ev.map)}" target="_blank" rel="noopener noreferrer">📍 Google Maps</a>` : ''}
                </div>
              </div>
              ${ev.details ? `
                <button type="button" class="detail-btn" aria-expanded="false" aria-controls="${detailId}">查看細節</button>
                <div id="${detailId}" class="details" hidden>${esc(ev.details)}</div>` : ''}
            </div>`;
          timeline.appendChild(article);
        });
        updateProgress();
      }

      $$('.tab').forEach(btn=>{
        btn.addEventListener('click',()=>{

          selectedDay = Number(btn.dataset.day);
          $$('.tab').forEach(b=>b.setAttribute('aria-selected', String(b===btn)));
          render();
        });
      });

      $$('.filter').forEach(btn=>{
        btn.addEventListener('click',()=>{
          filter = btn.dataset.filter;
          $$('.filter').forEach(b=>b.setAttribute('aria-pressed', String(b===btn)));
          render();
        });
      });

      $('#timeline').addEventListener('change',e=>{
        const cb = e.target.closest('[data-check]');
        if(!cb) return;
        cb.checked ? checked.add(cb.dataset.check) : checked.delete(cb.dataset.check);
        cb.closest('.event')?.classList.toggle('done',cb.checked);
        updateProgress();
      });

      $('#timeline').addEventListener('click',e=>{
        const btn = e.target.closest('.detail-btn');
        if(!btn) return;
        const target = document.getElementById(btn.getAttribute('aria-controls'));
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        btn.textContent = open ? '查看細節' : '收合細節';
        target.hidden = open;
      });

      $('#clearNote').addEventListener('click', ()=>{

        $('#dayNote').value = '';
        $('#dayNote').focus();
      });


      render();
    })();
  </script>
